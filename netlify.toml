# Netlify settings (any static host works: the build output is plain files in dist/).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Fingerprinted assets never change: cache them forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Note: do not redirect the old Wix event URLs (/kick-off, /cultuur-oso-*) until the
# events' `signup` links point at the new sign-up forms; they are those forms today.
